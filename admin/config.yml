backend:
  name: github
  repo: caseykeown/swim-for-vinny
  branch: main
  base_url: https://cms-auth.iluvprimitives.workers.dev
  auth_endpoint: /auth

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "gallery"
    label: "Photo & Video Gallery"
    label_singular: "Gallery Item"
    description: "Add photos or videos to your gallery. They will appear on your website automatically after you save."
    folder: "_gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - label: "Title / Caption"
        name: "title"
        widget: "string"
        hint: "A short description (e.g. Baby back float lesson)"

      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Photo", value: "photo" }
          - { label: "TikTok / Video Link", value: "video" }
        default: "photo"

      - label: "Photo"
        name: "photo"
        widget: "image"
        required: false
        hint: "Upload a photo. Leave blank if this is a video."

      - label: "Video URL"
        name: "video_url"
        widget: "string"
        required: false
        hint: "Paste a TikTok or YouTube URL. Leave blank if this is a photo."

      - label: "Show on website"
        name: "published"
        widget: "boolean"
        default: true