# ─────────────────────────────────────────────────────────────
# DECAP CMS CONFIG — ISR with Daphne
# ─────────────────────────────────────────────────────────────
# backend: uses GitHub as the content store.
# OAuth is handled by the separate Cloudflare Worker (cms-auth).
# When Daphne saves, Decap commits the file straight to the repo,
# which triggers a Cloudflare Pages rebuild automatically.
# ─────────────────────────────────────────────────────────────

backend:
  name: github
  repo: caseykeown/swim-for-vinny   # GitHub owner/repo
  branch: main
  # Point at your deployed cms-auth Cloudflare Worker URL.
  # Replace the placeholder below with the actual worker URL
  # after you deploy the OAuth worker (Step 2 in the README).
  base_url: https://cms-auth.iluvprimitives.workers.dev

# Where uploaded images get stored in the repo
media_folder: "uploads"
public_folder: "/uploads"

# ─────────────────────────────────────────────────────────────
# COLLECTIONS
# Daphne only sees ONE thing: her photo/video gallery.
# Keeping it scoped to one collection means the admin screen
# is clean — she's not confronted with site-wide CMS controls.
# ─────────────────────────────────────────────────────────────
collections:
  - name: "gallery"
    label: "Photo & Video Gallery"
    label_singular: "Gallery Item"
    description: "Add photos or videos to the gallery on your website. They'll appear automatically after you save."
    folder: "_gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - label: "Title / Caption"
        name: "title"
        widget: "string"
        hint: "A short description of the photo or video (e.g. 'Baby back float lesson')"

      - label: "Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Photo", value: "photo" }
          - { label: "TikTok / Video Link", value: "video" }
        default: "photo"

      - label: "Photo"
        name: "photo"
        widget: "image"
        required: false
        hint: "Upload a photo. Leave blank if this is a video."

      - label: "Video URL"
        name: "video_url"
        widget: "string"
        required: false
        hint: "Paste a TikTok or YouTube URL here. Leave blank if this is a photo."

      - label: "Show on website"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Uncheck to hide this item without deleting it."
